<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI OS Chatbot</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; }
      .bubble { padding: 12px 16px; border-radius: 12px; margin: 8px 0; }
      .user { background: #e8f0fe; margin-left: 40px; }
      .bot { background: #f1f3f4; margin-right: 40px; }
      form { display: flex; gap: 8px; margin-top: 20px; }
      input[type="text"] { flex: 1; padding: 10px; }
      button { padding: 10px 14px; }
    </style>
  </head>
  <body>
    <h1>AI OS Chatbot</h1>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="message" type="text" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <script>
      const chat = document.getElementById('chat');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message');

      function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = `bubble ${role}`;
        div.textContent = text;
        chat.appendChild(div);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';

        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        addMessage(data.response, 'bot');
      });
    </script>
  </body>
</html>
